services:
  postgres:
    image: postgres:16
    container_name: taskkill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskkill
      POSTGRES_USER: taskkill
      POSTGRES_PASSWORD: taskkill_local
    ports:
      - "5432:5432"
    volumes:
      - taskkill_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskkill -d taskkill"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  taskkill_pgdata: