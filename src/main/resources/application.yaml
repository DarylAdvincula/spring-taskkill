spring:
  application:
    name: taskkill
  datasource:
    url: jdbc:postgresql://localhost:5432/taskkill
    username: taskkill
    password: taskkill_local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  server:
    port: 8000
  jwt:
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000